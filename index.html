<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OFFICIAL ABS - 아마추어 대회 공식 로봇심판</title>
    <style>
        /* 📱 전 기종 모바일 브라우저 뷰포트 칼피팅 리셋 */
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b0b0c; color: #ffffff;
            display: flex; width: 100vw; height: 100vh; overflow: hidden;
        }
        #app-container { display: flex; width: 100%; height: 100%; }
        
        /* 📊 왼쪽 대형 본부석 스코어보드 & 제어판 */
        #sidebar {
            width: 32%; background-color: #141416; padding: 18px;
            display: flex; flex-direction: column; justify-content: space-between;
            border-right: 2px solid #232326; z-index: 10;
        }
        
        /* 🎥 오른쪽 실시간 트래킹 그라운드 */
        #main-stage {
            width: 68%; height: 100%; position: relative;
            display: flex; justify-content: center; align-items: center; background: #000;
        }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: contain; }

        /* 대회용 UI 디자인 요소 */
        h2 { margin: 0 0 15px 0; font-size: 20px; color: #00e5ff; text-align: center; letter-spacing: 1px; }
        .section-title { font-size: 11px; color: #8e8e93; text-transform: uppercase; margin-bottom: 6px; font-weight: bold; }
        .panel-box { background: #1c1c1e; padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #2c2c2e; }
        
        /* 🟢 LED 전광판 형태의 볼카운트 보드 */
        .board-row { display: flex; justify-content: space-around; align-items: center; margin-top: 5px; }
        .counter-circle {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #444; background: #222;
            display: inline-block; margin: 0 3px; transition: all 0.2s;
        }
        .b-active { background: #30d158; border-color: #30d158; box-shadow: 0 0 8px #30d158; }
        .s-active { background: #ff453a; border-color: #ff453a; box-shadow: 0 0 8px #ff453a; }
        .o-active { background: #ffcc00; border-color: #ffcc00; box-shadow: 0 0 8px #ffcc00; }

        select {
            width: 100%; padding: 12px; background:#2c2c2e; color:white; border:none;
            border-radius:8px; font-size: 15px; font-weight: bold; margin-bottom: 5px;
        }
        
        /* ⚡ 버튼 컴포넌트 */
        .btn {
            width: 100%; color: white; border: none; padding: 12px; font-size: 14px;
            font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s;
        }
        .btn-blue { background-color: #007aff; }
        .btn-red { background-color: #ff453a; }
        .btn-green { background-color: #30d158; }
        .btn-gray { background-color: #3a3a3c; }
        
        /* 📣 대형 판정 애니메이션 이펙트 */
        #judgement-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 90px; font-weight: 900; text-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 5; pointer-events: none; text-align: center; width: 100%;
        }
        .strike-anim { color: #ff453a; animation: strikeTrigger 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .ball-anim { color: #30d158; animation: ballTrigger 0.4s ease-out forwards; }
        
        @keyframes strikeTrigger { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        @keyframes ballTrigger { 0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        #rec-indicator {
            position: absolute; top: 20px; right: 20px; background: rgba(255,69,58,0.85);
            padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 12px; display: none; z-index: 6;
        }
        #setup-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0b0c; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
    </style>
    <!-- OpenCV 컴퓨터 비전 트래킹 코어 연동 -->
    <script async src="https://docs.opencv.org/4.5.4/opencv.js" onload="onOpenCvReady();"></script>
</head>
<body>

    <!-- 초기 엔진 빌드 대기 화면 -->
    <div id="setup-layer">
        <h1 style="color: #00e5ff; font-size: 28px; margin-bottom: 5px;">OFFICIAL ABS SYSTEM</h1>
        <p id="status-text" style="color: #8e8e93; margin-bottom: 25px;">테니스공 고정밀 트래킹 모듈을 활성화 중입니다...</p>
        <button id="start-btn" class="btn btn-blue" style="width:280px; font-size:18px; padding:16px;" disabled onclick="initSystem()">대회 모드 가동</button>
    </div>

    <!-- 메인 시스템 레이아웃 -->
    <div id="app-container">
        <!-- 📊 좌측 본부석 통합 관제 패널 -->
        <div id="sidebar">
            <div>
                <h2>OFFICIAL ABS</h2>
                
                <!-- 야구 전광판 카운터 -->
                <div class="panel-box">
                    <div class="section-title">경기 카운트 관리</div>
                    <div class="board-row">
                        <span style="font-weight:bold; color:#30d158;">B</span>
                        <div><span id="b1" class="counter-circle"></span><span id="b2" class="counter-circle"></span><span id="b3" class="counter-circle"></span></div>
                    </div>
                    <div class="board-row" style="margin-top: 8px;">
                        <span style="font-weight:bold; color:#ff453a;">S</span>
                        <div><span id="s1" class="counter-circle"></span><span id="s2" class="counter-circle"></span></div>
                    </div>
                    <div class="board-row" style="margin-top: 8px;">
                        <span style="font-weight:bold; color:#ffcc00;">O</span>
                        <div><span id="o1" class="counter-circle"></span><span id="o2" class="counter-circle"></span></div>
                    </div>
                </div>

                <!-- KBO 공식 비율 매핑 선택바 -->
                <div class="panel-box">
                    <div class="section-title">타자 설정 (KBO 가변 비율 적용)</div>
                    <select id="player-select" onchange="updateStrikeZone()">
                        <option value="140">유소년 리그 (140cm)</option>
                        <option value="155">주니어 리그 (155cm)</option>
                        <option value="165">시니어 리그 (165cm)</option>
                        <option value="175" selected>일반/동호회 (175cm)</option>
                    </select>
                </div>

                <!-- 돌발 상황 개입 버튼 -->
                <div class="panel-box">
                    <div class="section-title">비상용 본부석 수동 판정</div>
                    <div style="display: flex; gap: 6px;">
                        <button class="btn btn-red" onclick="triggerDecision('strike')">강제 S</button>
                        <button class="btn btn-green" onclick="triggerDecision('ball')">강제 B</button>
                    </div>
                </div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <button id="rec-btn" class="btn btn-blue" style="background:#e63946;" onclick="toggleRecording()">📹 공식 경기 영상 녹화</button>
                <button class="btn btn-gray" onclick="resetCount()">보드 카운트 리셋</button>
            </div>
        </div>

        <!-- 🎥 우측 실시간 트래킹 카메라 그라운드 -->
        <div id="main-stage">
            <div id="rec-indicator">● LIVE REC</div>
            <div id="judgement-overlay"></div>
            <video id="videoInput" playsinline></video>
            <canvas id="canvasOutput"></canvas>
        </div>
    </div>

    <script>
        let video = document.getElementById('videoInput');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d');
        let src, hsv, mask;
        let isPlaying = false;

        let balls = 0, strikes = 0, outs = 0;
        let isJudging = false;
        let zone = { left: 0, right: 0, top: 0, bottom: 0 };

        // 궤적 복원(외삽) 알고리즘 메모리
        let trackPoints = [];
        let physicsVelocity = { x: 0, y: 0 };
        let hiddenFrames = 0;
        const TRIGGER_MARGIN = 45; 

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        function onOpenCvReady() {
            document.getElementById('status-text').innerText = "엔진 빌드 완료. 스마트폰을 가로로 눕혀 백네트에 거치하세요.";
            document.getElementById('start-btn').disabled = false;
        }

        async function initSystem() {
            document.getElementById('setup-layer').style.display = 'none';
            const constraints = {
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } },
                audio: false
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.play();
                isPlaying = true;
                
                video.addEventListener('loadedmetadata', () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
                    hsv = new cv.Mat();
                    mask = new cv.Mat();
                    updateStrikeZone();
                    requestAnimationFrame(processVideo);
                });
            } catch (err) {
                alert("카메라 스트림 획득 실패: " + err.message);
            }
        }

        // KBO 공식 규정 비율(상한 56.35%, 하한 27.64%) 연산식 적용
        function updateStrikeZone() {
            const playerHeight = parseInt(document.getElementById('player-select').value);
            const scale = canvas.height / 360; 
            
            zone.top = Math.round(canvas.height - (playerHeight * scale * 0.58)); 
            zone.bottom = Math.round(canvas.height - (playerHeight * scale * 0.23));
            
            const boxWidth = 230; 
            zone.left = Math.round(canvas.width / 2 - (boxWidth / 2));
            zone.right = Math.round(canvas.width / 2 + (boxWidth / 2));
        }

        function processVideo() {
            if (!isPlaying) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            src.data.set(imgData.data);

            cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

            // 🟢 [테니스공 전용 멀티 스펙트럼 HSV 스캐너]
            // 새 연두색 공부터 때가 탄 노란/녹색 공까지 필터링 통과 대역 지정
            let lowRange = [25, 40, 40, 0];
            let highRange = [78, 255, 255, 255];

            let low = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), lowRange);
            let high = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), highRange);
            cv.inRange(hsv, low, high, mask);

            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let ballFound = false;
            let bx = 0, by = 0, br = 0;

            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let circle = cv.minEnclosingCircle(cnt);
                
                // 테니스공 거리에 따른 가변 크기 한계선 필터 (2.5px ~ 45px)
                if (circle.radius > 2.5 && circle.radius < 45) {
                    ballFound = true;
                    bx = circle.center.x;
                    by = circle.center.y;
                    br = circle.radius;
                    break;
                }
            }

            // 🔲 방송용 스타일 9분할 레이저 가이드선 드로잉
            ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 5;
            ctx.strokeRect(zone.left, zone.top, zone.right - zone.left, zone.bottom - zone.top);
            ctx.strokeStyle = "rgba(0, 229, 255, 0.25)"; ctx.lineWidth = 2;
            const cw = (zone.right - zone.left) / 3;
            const rh = (zone.bottom - zone.top) / 3;
            for (let i = 1; i < 3; i++) {
                ctx.beginPath(); ctx.moveTo(zone.left + (cw * i), zone.top); ctx.lineTo(zone.left + (cw * i), zone.bottom); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(zone.left, zone.top + (rh * i)); ctx.lineTo(zone.right, zone.top + (rh * i)); ctx.stroke();
            }
            ctx.fillStyle = "rgba(255, 255, 255, 0.2)"; ctx.fillRect(zone.left, zone.bottom, zone.right - zone.left, 5);

            // 🎯 포수 가림(Occlusion) 유도 연산 메커니즘
            if (ballFound) {
                hiddenFrames = 0;
                if (trackPoints.length > 0) {
                    let prev = trackPoints[trackPoints.length - 1];
                    physicsVelocity.x = bx - prev.x;
                    physicsVelocity.y = by - prev.y;
                }
                trackPoints.push({ x: bx, y: by });
                if (trackPoints.length > 6) trackPoints.shift();

                ctx.beginPath(); ctx.arc(bx, by, br, 0, 2 * Math.PI);
                ctx.fillStyle = "rgba(255, 235, 59, 0.85)"; ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();

                evalABS(bx, by);
            } else {
                // 💥 공이 은폐되었을 때 발동하는 중력 연산 물리 예측 엔진
                if (trackPoints.length >= 2 && hiddenFrames < 15 && !isJudging) {
                    hiddenFrames++;
                    let lastBall = trackPoints[trackPoints.length - 1];
                    
                    // 속도 벡터값에 지구 중력 가속도 오차 보정 상시 누적 계산
                    let simulatedX = lastBall.x + (physicsVelocity.x * hiddenFrames);
                    let simulatedY = lastBall.y + (physicsVelocity.y * hiddenFrames) + (0.35 * hiddenFrames);

                    ctx.beginPath(); ctx.arc(simulatedX, simulatedY, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = "rgba(255, 69, 58, 0.6)"; ctx.fill();

                    evalABS(simulatedX, simulatedY);
                } else if (!isJudging) {
                    trackPoints = [];
                }
            }

            contours.delete(); hierarchy.delete(); low.delete(); high.delete();
            requestAnimationFrame(processVideo);
        }

        // 고속 투구 통과 스캔 알고리즘
        function evalABS(x, y) {
            if (isJudging) return;

            if (x > (zone.left - TRIGGER_MARGIN) && x < (zone.right + TRIGGER_MARGIN) && y > (zone.top - 20) && y < (zone.bottom + TRIGGER_MARGIN)) {
                if (x >= zone.left && x <= zone.right && y >= zone.top && y <= zone.bottom) {
                    triggerDecision("strike");
                } else {
                    if (y > zone.bottom || x < zone.left || x > zone.right || y < zone.top) {
                        triggerDecision("ball");
                    }
                }
            }
        }

        // 판정 결과 도출 및 음성(TTS) 송출 시스템
        function triggerDecision(result) {
            if (isJudging) return;
            isJudging = true;

            const overlay = document.getElementById('judgement-overlay');
            if (result === "strike") {
                overlay.innerHTML = "<span class='strike-anim'>STRIKE</span>";
                updateCounter('strike'); speak("스트라이크");
            } else {
                overlay.innerHTML = "<span class='ball-anim'>BALL</span>";
                updateCounter('ball'); speak("볼");
            }

            setTimeout(() => { 
                overlay.innerText = ""; isJudging = false; trackPoints = []; hiddenFrames = 0;
            }, 1500); 
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR'; utterance.rate = 1.25;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 야구 카운트 규칙 자동 연산 보드
        function updateCounter(type) {
            if (type === 'strike') {
                strikes++;
                if (strikes >= 3) { strikes = 0; balls = 0; outs++; speak("삼진 아웃"); }
            } else if (type === 'ball') {
                balls++;
                if (balls >= 4) { strikes = 0; balls = 0; speak("볼 넷"); }
            }
            if (outs >= 3) { outs = 0; strikes = 0; balls = 0; speak("공수 교대 쓰리아웃"); }
            renderScoreboard();
        }

        function renderScoreboard() {
            for(let i=1; i<=3; i++) document.getElementById(`b${i}`).className = i <= balls ? 'counter-circle b-active' : 'counter-circle';
            for(let i=1; i<=2; i++) document.getElementById(`s${i}`).className = i <= strikes ? 'counter-circle s-active' : 'counter-circle';
            for(let i=1; i<=2; i++) document.getElementById(`o${i}`).className = i <= outs ? 'counter-circle o-active' : 'counter-circle';
        }

        function resetCount() { balls = 0; strikes = 0; outs = 0; renderScoreboard(); speak("카운트를 초기화합니다"); }

        // 합의 판정용 고화질 공식 비디오 캔버스 캡처 녹화기
        function toggleRecording() {
            const recBtn = document.getElementById('rec-btn');
            const indicator = document.getElementById('rec-indicator');

            if (!isRecording) {
                recordedChunks = [];
                let canvasStream = canvas.captureStream(30);
                let options = { mimeType: 'video/webm; codecs=vp8' };

                try { mediaRecorder = new MediaRecorder(canvasStream, options); } catch (e) { mediaRecorder = new MediaRecorder(canvasStream); }
                mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = function() {
                    let blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
                    let url = URL.createObjectURL(blob);
                    let a = document.createElement('a');
                    a.href = url; a.download = `ABS_OFFICIAL_RECORD.mp4`;
                    document.body.appendChild(a); a.click();
                    document.body.removeChild(a);
                };
                mediaRecorder.start(1000); isRecording = true;
                recBtn.innerText = "🛑 녹화 종료 및 영상 저장";
                indicator.style.display = "block";
            } else {
                mediaRecorder.stop(); isRecording = false;
                recBtn.innerText = "📹 공식 경기 영상 녹화";
                indicator.style.display = "none";
            }
        }
    </script>
</body>
</html>
